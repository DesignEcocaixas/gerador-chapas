<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Chapas</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <style>
    :root {
      --bg-surface: #f1f5f9;
      --card-bg: #ffffff;
      --primary-color: #0f172a;
      --accent-color: #2563eb;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-surface);
      color: var(--primary-color);
      height: 100vh;
      margin: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .app-header {
      padding: 1rem 0 0.5rem;
    }

    .app-title {
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      color: var(--primary-color);
    }

    main {
      flex: 1;
      min-height: 0;
      padding-bottom: 1rem;
    }

    .card-custom {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 4px 15px -3px rgba(15, 23, 42, 0.05);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .form-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
    }

    .form-control, .form-select {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0.4rem 0.75rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--primary-color);
      transition: all 0.2s ease;
    }

    .form-control:focus, .form-select:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .preview-wrapper {
      background-color: #e2e8f0;
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    canvas {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      background-color: #ffffff;
    }

    #print-container {
      display: none;
    }

    .btn-action {
      padding: 0.6rem 1rem;
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }

    .btn-primary-custom {
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
    }

    .btn-primary-custom:hover {
      background-color: #1e293b;
      color: #ffffff;
    }

    .btn-outline-custom {
      background-color: transparent;
      color: var(--primary-color);
      border: 1px solid var(--border-color);
    }

    .btn-outline-custom:hover {
      background-color: #f8fafc;
      color: var(--primary-color);
    }

    /* --- REGRAS DE IMPRESSÃO --- */
    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      body { height: auto; overflow: visible; }
      body * { visibility: hidden !important; }
      #print-container, #print-container * { visibility: visible !important; }
      #print-container {
        display: flex !important;
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        justify-content: center !important;
        align-items: center !important;
        background: #ffffff !important;
      }
      #print-container img {
        width: 100vw !important;
        height: 100vh !important;
        object-fit: contain !important;
      }
    }
  </style>
</head>
<body>

  <!-- Cabeçalho -->
  <header class="app-header">
    <div class="container-fluid px-4 text-center">
      <h1 class="app-title m-0">Gerador de Especificação</h1>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="container-fluid px-4">
    <div class="row g-3 justify-content-center h-100">
      
      <!-- Container 1: Formulário -->
      <div class="col-xl-4 col-lg-5 col-md-6 h-100">
        <div class="card-custom p-3">
          <div class="d-flex align-items-center justify-content-between mb-3 border-bottom pb-2">
            <h2 class="h5 font-weight-bold m-0" style="font-size: 1rem; font-weight: 600;">Parâmetros da Chapa</h2>
            <span class="badge bg-light text-dark border">A4 / Ofício</span>
          </div>

          <form id="specForm" onsubmit="event.preventDefault();" class="d-flex flex-column gap-2 flex-grow-1 justify-content-between">
            
            <div class="d-flex flex-column gap-2">
              <!-- 1. Fornecedor -->
              <div>
                <label for="fornecedorSelect" class="form-label">Fornecedor</label>
                <select id="fornecedorSelect" class="form-select">
                  <option value="">Carregando fornecedores...</option>
                </select>
              </div>

              <!-- 2. Material -->
              <div>
                <label for="materialSelect" class="form-label">Material</label>
                <select id="materialSelect" class="form-select" disabled>
                  <option value="">Selecione o Fornecedor primeiro</option>
                </select>
              </div>
              
              <!-- 3. Novo Campo de Entrada Manual do Modelo -->
              <div>
                <label for="modeloInput" class="form-label">MODELO CHAPA</label>
                <input type="text" id="modeloInput" class="form-control" placeholder="Digite o modelo (Ex: Caixa Pizza)">
              </div>

              <div class="row g-2">
                <!-- 4. Código / Tamanho -->
                <div class="col-6">
                  <label for="modeloSelect" class="form-label">MODELOS QUE A CHAPA FAZ</label>
                  <select id="modeloSelect" class="form-select" disabled>
                    <option value="">Aguardando Material</option>
                  </select>
                </div>

                <!-- 5. Medida -->
                <div class="col-6">
                  <label for="medida" class="form-label">Medida</label>
                  <input type="text" id="medida" class="form-control" placeholder="Auto-preenchido">
                </div>
              </div>

              <div class="row g-2">
                <div class="col-12">
                  <label for="data" class="form-label">Data</label>
                  <input type="text" id="data" class="form-control" placeholder="DD/MM/AAAA" maxlength="10">
                </div>
              </div>

              <div>
                <label for="logoUpload" class="form-label">Logotipo (Opcional)</label>
                <input type="file" id="logoUpload" class="form-control" accept="image/*">
              </div>
            </div>

            <!-- Ações: Coladas no final -->
            <div class="pt-2 border-top mt-2">
              <div class="row g-2">
                <div class="col-6">
                  <button id="btnPrint" type="button" class="btn btn-primary-custom btn-action w-100">
                    <i class="bi bi-printer"></i> Imprimir
                  </button>
                </div>
                <div class="col-6">
                  <button id="btnDownload" type="button" class="btn btn-outline-custom btn-action w-100">
                    <i class="bi bi-download"></i> Baixar PNG
                  </button>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- Container 2: Preview da Folha -->
      <div class="col-xl-5 col-lg-6 col-md-6 h-100">
        <div class="card-custom p-3">
          <div class="preview-wrapper">
            <canvas id="canvas" width="600" height="840"></canvas>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Area Isolada de Impressão -->
  <div id="print-container">
    <img id="print-image" alt="Folha de Impressão">
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const printImage = document.getElementById('print-image');

    const fornecedorSelect = document.getElementById('fornecedorSelect');
    const materialSelect = document.getElementById('materialSelect');
    const modeloSelect = document.getElementById('modeloSelect');
    const modeloInput = document.getElementById('modeloInput');
    const inputMedida = document.getElementById('medida');
    const inputData = document.getElementById('data');
    const logoUpload = document.getElementById('logoUpload');
    const btnDownload = document.getElementById('btnDownload');
    const btnPrint = document.getElementById('btnPrint');

    let chapasData = [];

    // --- 1. BUSCAR DADOS DA API ---
    async function fetchChapas() {
      try {
        const response = await fetch('https://ecoflow.seteumdev.com.br/api/chapas');
        const result = await response.json();

        if (result.success) {
          chapasData = result.data;
          iniciarFiltros();
        } else {
          fornecedorSelect.innerHTML = '<option value="">Erro ao carregar dados</option>';
        }
      } catch (error) {
        console.error('Erro na API:', error);
        fornecedorSelect.innerHTML = '<option value="">Falha na conexão</option>';
      }
    }

    // --- 2. LÓGICA DE FILTRAGEM CASCATA ---
    function iniciarFiltros() {
      const fornecedores = [...new Set(chapasData.map(c => c.fornecedor).filter(Boolean))].sort();
      fornecedorSelect.innerHTML = '<option value="">Selecione o Fornecedor...</option>';
      fornecedores.forEach(f => {
        fornecedorSelect.innerHTML += `<option value="${f}">${f}</option>`;
      });
      render();
    }

    fornecedorSelect.addEventListener('change', () => {
      const f = fornecedorSelect.value;
      materialSelect.innerHTML = '<option value="">Selecione o Material...</option>';
      modeloSelect.innerHTML = '<option value="">Aguardando Material</option>';
      inputMedida.value = '';
      
      if (f) {
        materialSelect.disabled = false;
        modeloSelect.disabled = true;

        const materiais = [...new Set(chapasData.filter(c => c.fornecedor === f).map(c => c.material).filter(Boolean))].sort();
        materiais.forEach(m => {
          materialSelect.innerHTML += `<option value="${m}">${m}</option>`;
        });
      } else {
        materialSelect.disabled = true;
        modeloSelect.disabled = true;
      }
      render();
    });

    materialSelect.addEventListener('change', () => {
      const f = fornecedorSelect.value;
      const m = materialSelect.value;
      
      modeloSelect.innerHTML = '<option value="">Selecione o Tamanho/Código...</option>';
      inputMedida.value = '';

      if (f && m) {
        modeloSelect.disabled = false;
        const chapasFiltradas = chapasData.filter(c => c.fornecedor === f && c.material === m);
        
        chapasFiltradas.forEach(chapa => {
          const indexReal = chapasData.indexOf(chapa);
          modeloSelect.innerHTML += `<option value="${indexReal}">${chapa.modelo}</option>`;
        });
      } else {
        modeloSelect.disabled = true;
      }
      render();
    });

    modeloSelect.addEventListener('change', () => {
      const idx = modeloSelect.value;
      if (idx !== "") {
        const chapaSelecionada = chapasData[idx];
        inputMedida.value = chapaSelecionada.medida || '';
      } else {
        inputMedida.value = '';
      }
      render();
    });

    // --- 3. MÁSCARA DA DATA ---
    inputData.addEventListener('input', (e) => {
      let v = e.target.value.replace(/\D/g, ''); 
      if (v.length > 8) v = v.substring(0, 8); 
      if (v.length > 4) { v = v.replace(/^(\d{2})(\d{2})(\d{1,4}).*/, '$1/$2/$3'); }
      else if (v.length > 2) { v = v.replace(/^(\d{2})(\d{1,2}).*/, '$1/$2'); }
      e.target.value = v;
      render();
    });

    // --- 4. RENDERIZAÇÃO DO CANVAS ---
    let customLogo = new Image();
    customLogo.src = 'logo.png';
    customLogo.onload = () => render();
    customLogo.onerror = () => { render(); };

    function render() {
      const width = canvas.width;
      const height = canvas.height;

      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = '#0F172A';
      ctx.textAlign = 'center';

      const materialText = materialSelect.value || 'MATERIAL';
      const fornText = fornecedorSelect.value || '_________________';
      const modeloInputText = modeloInput.value || 'CÓDIGO/FACA';
      
      let modeloText = 'TAMANHO';
      if(modeloSelect.value !== "") {
         modeloText = chapasData[modeloSelect.value].modelo;
      }

      const medidaText = inputMedida.value || '____ x ____';
      const dataText = inputData.value || '__/__/____';

      ctx.font = '700 24px "Inter", sans-serif';
      ctx.fillText('MATERIAL', width / 2, 50);

      ctx.font = '900 58px "Inter", sans-serif';
      ctx.fillText(materialText.toUpperCase(), width / 2, 110);

      ctx.font = '700 52px "Inter", sans-serif';
      ctx.fillText(medidaText, width / 2, 185);

      // ==========================================
      // AJUSTE DINÂMICO PARA O NOME DO MODELO/FACA
      // ==========================================
      let facaText = modeloInputText.toUpperCase();
      let facaFontSize = 60; 
      ctx.font = `900 ${facaFontSize}px "Inter", sans-serif`;
      
      let facaTextWidth = ctx.measureText(facaText).width;
      const maxFacaTextWidth = 540; 
      
      if (facaTextWidth > maxFacaTextWidth) {
        facaFontSize = Math.floor(facaFontSize * (maxFacaTextWidth / facaTextWidth));
        ctx.font = `900 ${facaFontSize}px "Inter", sans-serif`;
      }
      
      ctx.fillText(facaText, width / 2, 280);
      
      // ==========================================
      // AJUSTE DINÂMICO PARA O TAMANHO/CÓDIGO
      // ==========================================
      let tamanhoText = modeloText.toUpperCase();
      let tamanhoFontSize = 120; 
      ctx.font = `900 ${tamanhoFontSize}px "Inter", sans-serif`;
      
      let textWidth = ctx.measureText(tamanhoText).width;
      const maxTextWidth = 540; 
      
      if (textWidth > maxTextWidth) {
        tamanhoFontSize = Math.floor(tamanhoFontSize * (maxTextWidth / textWidth));
        ctx.font = `900 ${tamanhoFontSize}px "Inter", sans-serif`;
      }
      
      ctx.fillText(tamanhoText, width / 2, 400);

      // ==========================================

      ctx.font = '700 22px "Inter", sans-serif';
      ctx.fillText('FORNECEDOR', width / 2, 480);

      ctx.font = '600 32px "Inter", sans-serif';
      ctx.fillText(fornText.toUpperCase(), width / 2, 520);

      ctx.font = '400 32px "Inter", sans-serif';
      ctx.fillText(dataText, width / 2, 600);

      if (customLogo.complete && customLogo.naturalWidth !== 0) {
        const logoWidth = 140; 
        const aspectRatio = customLogo.width / customLogo.height;
        const logoHeight = logoWidth / aspectRatio;
        const logoX = (width - logoWidth) / 2;
        const logoY = 660; 
        ctx.drawImage(customLogo, logoX, logoY, logoWidth, logoHeight);
      } else {
        ctx.fillStyle = '#94A3B8';
        ctx.font = 'italic 18px "Inter", sans-serif';
        ctx.fillText('[ LOGO DA EMPRESA ]', width / 2, 720);
      }
    }

    logoUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          const img = new Image();
          img.onload = function() {
            customLogo = img;
            render();
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    [inputMedida, modeloInput].forEach(input => input.addEventListener('input', render));

    btnDownload.addEventListener('click', () => {
      let nomeArquivo = 'arte';
      if(modeloSelect.value !== "") nomeArquivo = chapasData[modeloSelect.value].modelo;
      
      const link = document.createElement('a');
      link.download = `especificacao-${nomeArquivo}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    btnPrint.addEventListener('click', () => {
      printImage.src = canvas.toDataURL('image/png');
      setTimeout(() => window.print(), 50);
    });

    fetchChapas();
    render();
  </script>
</body>
</html>
